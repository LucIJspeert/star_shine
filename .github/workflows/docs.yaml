name: pages-build-deployment

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Install UV
      - name: Install UV
        run: pip install uv

      # Install dev dependencies including pdoc
      - name: Install dev dependencies
        run: uv add --dev pdoc

      # Generate docs with pdoc
      - name: Generate docs with pdoc
        env:
          LOGO: "https://raw.githubusercontent.com/LucIJspeert/star_shine/master/star_shine/data/images/Star_Shine_small_transparent.png"
        run: |
          uv run pdoc star_shine !star_shine.gui \
            -o docs \
            --docformat numpy \
            --logo "${{ env.LOGO }}"

      # Deploy docs to gh-pages branch
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./docs

name: Generate Docs in /docs Folder

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Install UV
      - name: Install UV
        run: pip install uv

      # Install dev dependencies including pdoc
      - name: Install dev dependencies
        run: uv add --dev pdoc

      # Generate docs with pdoc
      - name: Generate docs with pdoc into /docs
        env:
          LOGO: "https://raw.githubusercontent.com/LucIJspeert/star_shine/master/star_shine/data/images/Star_Shine_small_transparent.png"
        run: |
          pdoc star_shine !star_shine.gui \
            -o docs \
            --docformat numpy \
            --logo "${{ env.LOGO }}"

      # Commit and push updated docs
      - name: Commit and push updated docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add docs/
          git diff --quiet && git diff --staged --quiet || git commit -m "Update docs [skip ci]"
          git push
